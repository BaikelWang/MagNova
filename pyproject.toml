[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magnova-agent"
version = "0.4.0"
description = "Evidence-grounded MiniMind agent and orchestration layer for MagNova"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3",
  "requests>=2.31,<3",
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
ui = [
  "streamlit>=1.36,<2",
  "altair>=5,<7",
  "pandas>=2,<4",
]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
magnova-agent = "magnova_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
