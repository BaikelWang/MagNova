<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">MagNova：从研究需求到可追溯候选的科研工作流</title>
  <desc id="arch-desc">三条职责泳道分别是用户与证据、模型理解和 Harness 确定性控制、科学计算与可追溯输出。MiniMind理解自然语言需求并形成MaterialRequest，确定性程序执行校验澄清、人工确认、持久任务调度。科学任务依次调用MatterGen生成、MatterSim弛豫、SACGT代理预测，输出候选、3D结构与CIF。DFT和实验是独立的后续核验，不表示当前候选已经验证。文献原文为研究提供可定位依据，不自动证明生成候选的物性。</desc>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#61756E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arch-gold-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#A88243" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
